<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Roi & Reine du Bal — Camille Sée</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Italiana&display=swap" rel="stylesheet" />
<style>
  :root {
    --noir: #0b0a0a;
    --noir-soft: #161413;
    --noir-card: #1d1a18;
    --or: #d4af37;
    --or-clair: #e8c96a;
    --or-fonce: #9c7d20;
    --creme: #f4ead5;
    --rouge: #b3251f;
    --gris: #6b6358;
    --gris-clair: #c9c1b3;
    --vert-ok: #4d8c5a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--noir);
    color: var(--creme);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at top, rgba(212, 175, 55, 0.10), transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(179, 37, 31, 0.07), transparent 50%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      repeating-linear-gradient(45deg, transparent 0, transparent 60px, rgba(212, 175, 55, 0.015) 60px, rgba(212, 175, 55, 0.015) 61px);
    pointer-events: none;
    z-index: 0;
  }
  #app { position: relative; z-index: 1; min-height: 100vh; }

  /* ============ ACCUEIL / VOTE — structure commune ============ */
  .ecran {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4vh 20px;
    text-align: center;
    position: relative;
  }
  .ornement {
    color: var(--or);
    font-size: 20px;
    letter-spacing: 12px;
    margin-bottom: 6px;
    opacity: 0.85;
  }
  .titre-grand {
    font-family: 'Italiana', serif;
    font-size: clamp(30px, 6vw, 60px);
    font-weight: 400;
    color: var(--or-clair);
    line-height: 1.05;
    letter-spacing: 2px;
    text-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
    text-transform: uppercase;
  }
  .titre-grand .amp {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    text-transform: none;
    color: var(--or);
    font-size: 1.5em;
    line-height: 0;
    margin: 0 0.06em;
    vertical-align: -0.12em;
    text-shadow: 0 0 24px rgba(212, 175, 55, 0.5);
  }
  .sous-titre {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(16px, 2.4vw, 22px);
    font-style: italic;
    color: var(--creme);
    margin-top: 6px;
    letter-spacing: 1px;
  }
  .college {
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gris-clair);
    opacity: 0.7;
    margin-top: 10px;
  }
  .dragon-container {
    position: relative;
    max-height: 30vh;
    width: auto;
    margin: 0 auto 6px;
    animation: dragonFloat 4s ease-in-out infinite;
    line-height: 0;
  }
  .dragon-img {
    max-height: 30vh;
    max-width: 170px;
    width: auto;
    height: auto;
    display: block;
    animation: dragonGlow 3.5s ease-in-out infinite;
  }
  @keyframes dragonGlow {
    0%, 100% { filter: drop-shadow(0 0 20px rgba(212,175,55,0.35)) drop-shadow(0 0 40px rgba(212,175,55,0.15)); }
    50% { filter: drop-shadow(0 0 35px rgba(232,201,106,0.55)) drop-shadow(0 0 70px rgba(212,175,55,0.3)) drop-shadow(0 0 100px rgba(255,140,40,0.15)); }
  }
  @keyframes dragonFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  @keyframes flotte { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }

  .cta {
    background: linear-gradient(135deg, var(--or-fonce), var(--or));
    color: var(--noir);
    border: none;
    padding: 16px 40px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 2px;
    cursor: pointer;
    border-radius: 2px;
    box-shadow: 0 10px 40px rgba(212, 175, 55, 0.25);
    transition: transform 0.2s, box-shadow 0.2s;
    text-transform: uppercase;
    margin-top: 26px;
  }
  .cta:hover { transform: translateY(-2px); box-shadow: 0 15px 50px rgba(212, 175, 55, 0.4); }
  .cta:active { transform: translateY(0); }
  .cta:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }

  .cta-second {
    background: transparent;
    color: var(--or-clair);
    border: 1.5px solid var(--or-fonce);
    padding: 12px 28px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    letter-spacing: 1.5px;
    cursor: pointer;
    border-radius: 2px;
    text-transform: uppercase;
    transition: all 0.2s;
  }
  .cta-second:hover { border-color: var(--or); background: rgba(212,175,55,0.08); }

  .lien-admin {
    position: absolute;
    top: 14px; right: 16px;
    color: var(--or);
    opacity: 0.5;
    cursor: pointer;
    transition: all 0.25s;
    padding: 6px;
    z-index: 10;
    line-height: 0;
  }
  .lien-admin svg { width: 26px; height: 26px; display: block; }
  .lien-admin:hover { opacity: 1; transform: rotate(-15deg) scale(1.1); }

  /* ============ SAISIE DU CODE (tactile) ============ */
  .code-slots { display: flex; gap: 10px; justify-content: center; margin: 22px 0 8px; }
  .slot {
    width: clamp(46px, 13vw, 64px);
    height: clamp(60px, 17vw, 84px);
    border: 2px solid var(--or-fonce);
    border-radius: 4px;
    background: var(--noir-card);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Italiana', serif;
    font-size: clamp(28px, 7vw, 42px);
    color: var(--or-clair);
  }
  .slot.actif { border-color: var(--or); box-shadow: 0 0 18px rgba(212,175,55,0.35); }
  .slot.sep { width: 14px; border: none; background: none; color: var(--gris); }
  .hint-code {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 17px;
    color: var(--gris-clair);
    margin-bottom: 14px;
    min-height: 22px;
  }
  .pave {
    display: grid;
    gap: 10px;
    width: min(420px, 92vw);
    margin: 0 auto;
  }
  .pave.chiffres { grid-template-columns: repeat(3, 1fr); }
  .pave.lettres { grid-template-columns: repeat(6, 1fr); }
  .touche {
    background: var(--noir-card);
    border: 1.5px solid rgba(212,175,55,0.25);
    color: var(--creme);
    border-radius: 4px;
    padding: 16px 0;
    font-family: 'Italiana', serif;
    font-size: clamp(20px, 5vw, 28px);
    cursor: pointer;
    transition: all 0.12s;
  }
  .pave.lettres .touche { font-size: clamp(16px, 4.2vw, 22px); padding: 14px 0; }
  .touche:active { background: var(--or); color: var(--noir); transform: scale(0.95); }
  .touche.efface { color: var(--rouge); border-color: rgba(179,37,31,0.4); }

  /* ============ CHOIX ROI / REINE ============ */
  .vote-wrap { width: min(640px, 94vw); margin: 0 auto; }
  .cat-titre {
    font-family: 'Italiana', serif;
    font-size: 24px;
    color: var(--or-clair);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin: 26px 0 14px;
    text-align: center;
  }
  .cat-titre .pico { color: var(--rouge); }
  .grille-cand { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .carte-cand {
    background: var(--noir-card);
    border: 2px solid rgba(212,175,55,0.2);
    border-radius: 4px;
    padding: 18px 12px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 19px;
    font-weight: 600;
    color: var(--creme);
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
  }
  .carte-cand:active { transform: scale(0.97); }
  .carte-cand.choisi {
    border-color: var(--or);
    background: linear-gradient(135deg, rgba(212,175,55,0.14), rgba(179,37,31,0.06));
    box-shadow: 0 0 22px rgba(212,175,55,0.3);
    color: var(--or-clair);
  }
  .carte-cand.choisi::after {
    content: '✓';
    position: absolute; top: 6px; right: 9px;
    color: var(--or); font-size: 16px;
  }

  /* ============ MESSAGES ============ */
  .message { margin: 16px auto; padding: 12px 18px; border-radius: 3px; font-size: 15px; max-width: 460px; }
  .message.erreur { background: rgba(179,37,31,0.15); border: 1px solid var(--rouge); color: #f0b7b3; }
  .message.ok { background: rgba(77,140,90,0.15); border: 1px solid var(--vert-ok); color: #b9e0c1; }

  /* ============ MERCI ============ */
  .merci-couronne { font-size: 72px; line-height: 1; animation: flotte 3s ease-in-out infinite; }

  /* ============ ADMIN ============ */
  .admin-wrap { width: min(900px, 94vw); margin: 0 auto; padding: 40px 0 80px; }
  .admin-head { text-align: center; margin-bottom: 26px; }
  .admin-head h1 { font-family: 'Italiana', serif; color: var(--or-clair); font-size: 32px; letter-spacing: 2px; }
  .onglets { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 26px; }
  .onglet {
    background: transparent; border: 1px solid var(--or-fonce); color: var(--gris-clair);
    padding: 9px 18px; border-radius: 2px; cursor: pointer; font-size: 13px;
    letter-spacing: 1px; text-transform: uppercase; transition: all 0.2s;
  }
  .onglet.actif { background: var(--or); color: var(--noir); border-color: var(--or); font-weight: 600; }
  .panneau { background: var(--noir-soft); border: 1px solid rgba(212,175,55,0.15); border-radius: 6px; padding: 26px; }
  .panneau h2 { font-family: 'Italiana', serif; color: var(--or-clair); font-size: 22px; margin-bottom: 16px; letter-spacing: 1px; }
  .ligne-ajout { display: flex; gap: 10px; margin-bottom: 18px; }
  .input-txt {
    flex: 1; background: var(--noir-card); border: 1.5px solid var(--or-fonce); color: var(--creme);
    padding: 12px 14px; border-radius: 3px; font-size: 16px; font-family: 'Inter', sans-serif;
  }
  .input-txt:focus { outline: none; border-color: var(--or); }
  .btn-or {
    background: linear-gradient(135deg, var(--or-fonce), var(--or)); color: var(--noir);
    border: none; padding: 12px 22px; border-radius: 3px; cursor: pointer; font-weight: 600;
    letter-spacing: 1px; text-transform: uppercase; font-size: 13px; white-space: nowrap;
  }
  .btn-or:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-danger {
    background: transparent; color: var(--rouge); border: 1px solid var(--rouge);
    padding: 10px 18px; border-radius: 3px; cursor: pointer; font-size: 13px; letter-spacing: 1px; text-transform: uppercase;
  }
  .liste-noms { display: flex; flex-direction: column; gap: 8px; }
  .nom-item {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--noir-card); border: 1px solid rgba(212,175,55,0.15);
    border-radius: 3px; padding: 11px 14px; font-size: 15px;
  }
  .nom-item .x { color: var(--rouge); cursor: pointer; font-size: 20px; padding: 0 6px; line-height: 1; }
  .deux-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 640px) { .deux-col { grid-template-columns: 1fr; } }
  .stat-grille { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .stat-box { background: var(--noir-card); border: 1px solid rgba(212,175,55,0.15); border-radius: 4px; padding: 20px; text-align: center; }
  .stat-box .num { font-family: 'Italiana', serif; font-size: 40px; color: var(--or-clair); }
  .stat-box .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: var(--gris-clair); margin-top: 6px; }
  .note { font-size: 13px; color: var(--gris-clair); font-style: italic; line-height: 1.5; margin-top: 12px; }

  /* ============ CODES IMPRIMABLES ============ */
  .codes-grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-top: 18px; max-height: 360px; overflow: auto; padding: 4px; }
  .code-chip {
    background: var(--noir-card); border: 1px solid rgba(212,175,55,0.2); border-radius: 3px;
    padding: 8px; text-align: center; font-family: 'Italiana', serif; font-size: 18px; color: var(--or-clair); letter-spacing: 2px;
  }

  /* ============ RÉVÉLATION — CHAUDRON ============ */
  .reveal-ecran {
    min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 4vh 20px; position: relative; overflow: hidden;
  }
  .reveal-titre { font-family:'Italiana',serif; color:var(--or-clair); font-size: clamp(26px,5vw,48px); letter-spacing:3px; text-transform:uppercase; text-align:center; text-shadow:0 0 30px rgba(212,175,55,0.3); margin-bottom: 8px; transition: opacity 0.6s; }

  /* Scène : chaudron + halo + noms qui tombent */
  .chaudron-scene {
    position: relative;
    width: min(480px, 92vw);
    height: min(440px, 60vh);
    margin: 10px auto;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .chaudron-glow {
    position: absolute; left: 50%; bottom: 34%; transform: translate(-50%, 0);
    width: 60%; height: 32%; border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(255,150,40,0.0), rgba(212,175,55,0.0) 70%);
    filter: blur(8px); pointer-events: none; z-index: 2;
  }
  .chaudron-img {
    position: relative; z-index: 3;
    width: 100%; height: auto; max-height: 100%;
    object-fit: contain; display: block;
    filter: drop-shadow(0 14px 30px rgba(0,0,0,0.7));
  }
  .chaudron-scene.secoue { animation: chaudronSecoue 0.18s linear infinite; }
  @keyframes chaudronSecoue {
    0%{transform:translate(0,0)} 25%{transform:translate(var(--shake,2px),-1px)}
    50%{transform:translate(calc(var(--shake,2px)*-1),1px)} 75%{transform:translate(1px,var(--shake,2px))} 100%{transform:translate(0,0)}
  }
  /* étincelles / bulles qui montent du chaudron */
  .bulle { position:absolute; z-index:5; border-radius:50%; background: radial-gradient(circle at 35% 30%, var(--or-clair), var(--or) 60%, transparent); pointer-events:none; }

  .nom-tombe {
    position: absolute; z-index: 4; top: 0; left: 50%;
    font-family:'Cormorant Garamond',serif; font-weight:700;
    font-size: clamp(18px, 3.4vw, 26px); white-space: nowrap;
    color: var(--creme); text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    pointer-events: none; will-change: transform, opacity;
  }
  .nom-tombe.roi { color: #cfe0ff; }
  .nom-tombe.reine { color: #ffd9ea; }

  /* noms qui bouillonnent DANS le chaudron (tournoient + remontent/replongent) */
  .nom-churn {
    position: absolute; z-index: 6; top: 0; left: 0;
    font-family:'Italiana', serif; font-weight:400;
    font-size: clamp(24px, 6vw, 46px); white-space: nowrap; letter-spacing: 0.5px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.9), 0 0 22px rgba(255,180,70,0.55);
    pointer-events: none; will-change: transform, opacity;
  }
  .nom-churn.roi { color: #eaf2ff; }
  .nom-churn.reine { color: #ffe9f3; }

  /* flash du climax */
  .flash {
    position: fixed; inset: 0; z-index: 50; pointer-events: none;
    background: radial-gradient(circle at center, rgba(255,240,200,0.95), rgba(212,175,55,0.5) 40%, transparent 70%);
    opacity: 0;
  }

  /* parchemins gagnants — superposés au centre, hors flux (zéro scroll) */
  .parchemins {
    position: absolute; inset: 0; z-index: 6; pointer-events: none;
    display: flex; flex-direction: column; gap: 2.5vh;
    align-items: center; justify-content: center;
  }
  @media (min-aspect-ratio: 1/1) {
    .parchemins { flex-direction: row; gap: 3vw; }
    .parchemin { width: min(46vw, 540px); }
  }
  .parchemin {
    position: relative; width: min(540px, 92vw); aspect-ratio: 820 / 553;
    max-height: 44vh;
    background-size: contain; background-repeat: no-repeat; background-position: center;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transform: scale(0.6);
  }
  .parchemin.show { animation: parcheminEntre 1s cubic-bezier(0.16,0.84,0.3,1.06) forwards; }
  @keyframes parcheminEntre {
    0%   { opacity:0; transform: scale(0.5) translateY(28px); filter: blur(7px) drop-shadow(0 0 0 rgba(212,175,55,0)); }
    55%  { opacity:1; transform: scale(1.06) translateY(0);   filter: blur(0)   drop-shadow(0 0 28px rgba(212,175,55,0.65)); }
    100% { opacity:1; transform: scale(1)    translateY(0);   filter: blur(0)   drop-shadow(0 0 10px rgba(212,175,55,0.28)); }
  }
  .parchemin-contenu { text-align: center; width: 52%; margin-bottom: 4%; }
  .parchemin-role { font-family:'Italiana',serif; text-transform:uppercase; letter-spacing:4px; font-size: clamp(11px,1.8vw,15px); color: var(--rouge); margin-bottom: 2px; }
  .parchemin-nom {
    font-family:'Cormorant Garamond',serif; font-weight:700;
    font-size: clamp(22px, 4.6vw, 40px); line-height: 1.05;
    color: #2b1d0e;
  }
  .parchemin-voix { font-family:'Cormorant Garamond',serif; font-style:italic; font-size: clamp(12px,2vw,16px); color: #5a3d1c; margin-top: 2px; }

  .liste-vide { text-align:center; color: var(--gris); font-style:italic; padding: 30px; }
  .retour-mini { position:absolute; top:16px; left:18px; color:var(--gris-clair); cursor:pointer; font-size:13px; letter-spacing:1px; text-transform:uppercase; opacity:0.7; z-index:10; }
  .retour-mini:hover { opacity:1; color:var(--or-clair); }

  @media print {
    body { background: #fff; color: #000; }
    body::before, body::after { display:none; }
    body * { visibility: hidden; }
    .print-zone, .print-zone * { visibility: visible; }
    .print-zone { display: block !important; position: absolute; left: 0; top: 0; width: 100%; }
    .print-slip {
      border: 1.5px dashed #999; border-radius: 6px; padding: 14px 10px; text-align: center;
      page-break-inside: avoid; margin: 0;
    }
    .print-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .print-slip .pt-orn { color:#b8962e; letter-spacing:6px; font-size:12px; }
    .print-slip .pt-evt { font-family:'Cormorant Garamond',serif; font-size:11px; color:#444; margin:4px 0; }
    .print-slip .pt-code { font-family:'Italiana',serif; font-size:26px; letter-spacing:4px; color:#000; margin:4px 0; }
    .print-slip .pt-note { font-size:9px; color:#666; }
  }
  .print-zone { display: none; }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// ════════════════════════════════════════════════════════════
//  CONFIG (même projet Firebase que la playlist)
// ════════════════════════════════════════════════════════════
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBg512Fctuu5Vvgo18YOUh2hd-ICxTDDpg",
  authDomain: "electionsbal.firebaseapp.com",
  databaseURL: "https://electionsbal-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "electionsbal",
  storageBucket: "electionsbal.firebasestorage.app",
  messagingSenderId: "975411668751",
  appId: "1:975411668751:web:7539229e3881ca838a807a"
};
const ADMIN_PASSWORD = "baldragon";

// Code de TEST permanent : marche toujours, jamais "déjà voté", pour les
// répétitions. Chaque vote de test s'ajoute pour pouvoir tester la révélation.
// (Les votes de test s'effacent avec "Effacer tous les votes" dans Réglages.)
const TEST_CODE = "000TT";

// Musique de suspense jouée pendant la révélation. Colle ici l'URL du fichier
// (mp3) une fois hébergé, p.ex. "https://fsomsois-source.github.io/ElectionBal/suspense.mp3".
// Laisse vide ("") pour ne rien jouer.
const MUSIQUE_REVELATION_URL = "";

// ─── Minutage de la révélation (à caler sur ton morceau) ───
// CLIMAX_MS = instant où le roi et la reine s'inscrivent dans les parchemins.
// Le bouillonnement s'intensifie jusque-là. Cale-le sur le climax de la musique.
const CLIMAX_MS = 20000;
// NOMS_DEBUT_MS = quand les noms commencent à pleuvoir dans le chaudron.
const NOMS_DEBUT_MS = 2500;

// Toutes les données de l'élection vivent sous "election/" pour ne rien
// mélanger avec les chansons (qui sont sous "votes/", "candidatures/"…).
const ROOT = 'election';
const DB_URL = FIREBASE_CONFIG.databaseURL.replace(/\/$/, '');

// Alphabet des codes : 3 chiffres + 2 lettres. On enlève I et O (confusion 1/0).
const LETTRES = "ABCDEFGHJKLMNPQRSTUVWXYZ".split('');

// ════════════════════════════════════════════════════════════
//  INIT FIREBASE
// ════════════════════════════════════════════════════════════
let db = null, firebaseReady = false;
try {
  const app = initializeApp(FIREBASE_CONFIG);
  db = getDatabase(app);
  firebaseReady = true;
} catch (e) {
  console.error("Erreur Firebase :", e);
}

// ════════════════════════════════════════════════════════════
//  ÉTAT
// ════════════════════════════════════════════════════════════
const state = {
  vue: 'accueil',          // accueil | vote-code | vote-choix | vote-merci | admin-login | admin | reveal
  // données Firebase
  candidatsRoi: {},        // {id: {nom}}
  candidatsReine: {},      // {id: {nom}}
  votes: {},               // {CODE: {roi, reine, ts}}
  codes: {},               // {CODE: true}
  // saisie du vote
  codeSaisi: '',
  codeValide: null,        // le code accepté pour le vote en cours
  choixRoi: null,
  choixReine: null,
  enValidation: false,
  message: null,
  // admin
  ongletActif: 'candidats',
  // révélation
  revealEnCours: false,
};

// ════════════════════════════════════════════════════════════
//  ÉCOUTE FIREBASE
// ════════════════════════════════════════════════════════════
function startListeners() {
  if (!firebaseReady) return;
  onValue(ref(db, ROOT + '/candidatsRoi'),  s => { state.candidatsRoi  = s.val() || {}; render(); });
  onValue(ref(db, ROOT + '/candidatsReine'), s => { state.candidatsReine = s.val() || {}; render(); });
  onValue(ref(db, ROOT + '/votes'),          s => { state.votes = s.val() || {}; render(); });
  onValue(ref(db, ROOT + '/codes'),          s => { state.codes = s.val() || {}; render(); });
}

// Lecture directe REST (fiable juste avant écriture)
async function fetchJson(path) {
  const r = await fetch(DB_URL + '/' + ROOT + '/' + path + '.json', { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function patchRoot(updates) {
  const r = await fetch(DB_URL + '/' + ROOT + '/.json', {
    method: 'PATCH', body: JSON.stringify(updates),
    headers: { 'Content-Type': 'application/json' }
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
}

// ════════════════════════════════════════════════════════════
//  OUTILS
// ════════════════════════════════════════════════════════════
function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function navigate(vue) {
  state.vue = vue;
  state.message = null;
  if (vue === 'admin') location.hash = '#/admin';
  else if (vue === 'reveal') location.hash = '#/reveal';
  else if (vue === 'vote-code' || vue === 'vote-choix') location.hash = '#/vote';
  else location.hash = '';
  render();
}
function listeOrdonnee(obj) {
  // renvoie [{id, nom}] triés par nom
  return Object.entries(obj || {})
    .map(([id, v]) => ({ id, nom: (v && v.nom) || '' }))
    .filter(c => c.nom)
    .sort((a, b) => a.nom.localeCompare(b.nom, 'fr'));
}
function genererCode(existants) {
  for (let essais = 0; essais < 10000; essais++) {
    let c = '';
    for (let i = 0; i < 3; i++) c += Math.floor(Math.random() * 10);
    for (let i = 0; i < 2; i++) c += LETTRES[Math.floor(Math.random() * LETTRES.length)];
    if (!existants[c]) return c;
  }
  return null;
}

// ════════════════════════════════════════════════════════════
//  VOTE
// ════════════════════════════════════════════════════════════
function taperCode(ch) {
  if (state.codeSaisi.length >= 5) return;
  state.codeSaisi += ch;
  state.message = null;
  if (state.codeSaisi.length === 5) validerCode();
  else render();
}
function effacerCode() {
  state.codeSaisi = state.codeSaisi.slice(0, -1);
  state.message = null;
  render();
}
async function validerCode() {
  const code = state.codeSaisi;
  render();
  // Code de test : toujours accepté, on saute les contrôles
  if (code === TEST_CODE) {
    state.codeValide = code;
    state.choixRoi = null;
    state.choixReine = null;
    navigate('vote-choix');
    return;
  }
  // 1. le code doit exister
  if (!state.codes[code]) {
    state.message = { type: 'erreur', texte: "Ce code n'est pas valide. Vérifie ta saisie." };
    state.codeSaisi = '';
    render();
    return;
  }
  // 2. le code ne doit pas déjà avoir voté (mémoire + vérif serveur)
  let dejaVote = !!state.votes[code];
  if (!dejaVote && firebaseReady) {
    try { dejaVote = (await fetchJson('votes/' + code)) != null; } catch (e) {}
  }
  if (dejaVote) {
    state.message = { type: 'erreur', texte: "Ce code a déjà servi à voter." };
    state.codeSaisi = '';
    render();
    return;
  }
  state.codeValide = code;
  state.choixRoi = null;
  state.choixReine = null;
  navigate('vote-choix');
}

async function envoyerVote() {
  if (state.enValidation) return;
  if (!state.choixRoi || !state.choixReine) {
    state.message = { type: 'erreur', texte: "Choisis un roi ET une reine avant de valider." };
    render();
    return;
  }
  if (!firebaseReady) {
    state.message = { type: 'erreur', texte: "Base de données indisponible. Préviens un encadrant." };
    render();
    return;
  }
  state.enValidation = true; state.message = null; render();

  const code = state.codeValide;
  const estTest = (code === TEST_CODE);
  // clé d'écriture : un vrai code écrit sous son nom (1 seul vote) ;
  // le code de test écrit sous une clé unique à chaque fois (réutilisable).
  const cleVote = estTest ? ('test_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7)) : code;

  // anti double-vote : re-vérif serveur juste avant écriture (sauf code de test)
  if (!estTest) {
    try {
      const existant = await fetchJson('votes/' + code);
      if (existant != null) {
        state.message = { type: 'erreur', texte: "Ce code a déjà voté." };
        state.enValidation = false;
        retourAccueilVote();
        return;
      }
    } catch (e) { /* on continue */ }
  }

  try {
    await patchRoot({
      ['votes/' + cleVote]: { roi: state.choixRoi, reine: state.choixReine, ts: Date.now() }
    });
    if (!estTest) state.votes[code] = { roi: state.choixRoi, reine: state.choixReine };
    state.enValidation = false;
    navigate('vote-merci');
    // retour auto à la saisie du code pour la personne suivante
    setTimeout(() => { if (state.vue === 'vote-merci') retourAccueilVote(); }, 6000);
  } catch (e) {
    state.enValidation = false;
    state.message = { type: 'erreur', texte: "Échec de l'envoi. Réessaie." };
    render();
  }
}
function retourAccueilVote() {
  state.codeSaisi = ''; state.codeValide = null;
  state.choixRoi = null; state.choixReine = null;
  state.message = null; state.enValidation = false;
  navigate('vote-code');
}

// ════════════════════════════════════════════════════════════
//  ADMIN — candidats
// ════════════════════════════════════════════════════════════
async function ajouterCandidat(categorie) {
  const inp = document.getElementById('input-' + categorie);
  if (!inp) return;
  const nom = inp.value.trim();
  if (!nom) return;
  const id = 'c' + Date.now() + Math.random().toString(36).slice(2, 7);
  const cle = categorie === 'roi' ? 'candidatsRoi' : 'candidatsReine';
  try { await patchRoot({ [cle + '/' + id]: { nom } }); inp.value = ''; }
  catch (e) {
    const local = location.protocol !== 'http:' && location.protocol !== 'https:';
    alert("Erreur lors de l'ajout : " + (e && e.message ? e.message : e)
      + (local ? "\n\n⚠ La page est ouverte en local. Ouvre plutôt l'adresse github.io : l'écriture Firebase ne marche pas depuis un fichier." : ""));
  }
}
async function supprimerCandidat(categorie, id) {
  const cle = categorie === 'roi' ? 'candidatsRoi' : 'candidatsReine';
  try {
    await fetch(DB_URL + '/' + ROOT + '/' + cle + '/' + id + '.json', { method: 'DELETE' });
  } catch (e) { alert("Erreur lors de la suppression."); }
}

// ════════════════════════════════════════════════════════════
//  ADMIN — codes
// ════════════════════════════════════════════════════════════
async function genererCodes(nb) {
  const dejaCount = Object.keys(state.codes).length;
  if (dejaCount > 0 && !confirm(dejaCount + " codes existent déjà. Générer " + nb + " codes EN PLUS ?")) return;
  const updates = {};
  const local = Object.assign({}, state.codes);
  for (let i = 0; i < nb; i++) {
    const c = genererCode(local);
    if (!c) break;
    local[c] = true; updates['codes/' + c] = true;
  }
  try { await patchRoot(updates); }
  catch (e) { alert("Erreur lors de la génération."); }
}
async function reinitVotes() {
  if (!confirm("Effacer TOUS les votes ? Les codes restent valides. Action irréversible.")) return;
  try { await fetch(DB_URL + '/' + ROOT + '/votes.json', { method: 'DELETE' }); }
  catch (e) { alert("Erreur."); }
}
async function effacerCodes() {
  if (!confirm("Supprimer TOUS les codes générés ? (à ne faire que si tu veux repartir de zéro)")) return;
  try { await fetch(DB_URL + '/' + ROOT + '/codes.json', { method: 'DELETE' }); }
  catch (e) { alert("Erreur."); }
}
function imprimerCodes() {
  const codes = Object.keys(state.codes).sort();
  if (codes.length === 0) { alert("Aucun code à imprimer. Génère-les d'abord."); return; }
  window.print();
}

// ════════════════════════════════════════════════════════════
//  TALLY (décompte des voix)
// ════════════════════════════════════════════════════════════
function compter() {
  const roi = {}, reine = {};
  Object.values(state.votes).forEach(v => {
    if (v.roi)   roi[v.roi]    = (roi[v.roi]   || 0) + 1;
    if (v.reine) reine[v.reine] = (reine[v.reine] || 0) + 1;
  });
  return { roi, reine };
}
function gagnant(comptes, candidats) {
  const liste = listeOrdonnee(candidats);
  let best = null, bestN = -1;
  liste.forEach(c => {
    const n = comptes[c.id] || 0;
    if (n > bestN) { bestN = n; best = c; }
  });
  return best ? { nom: best.nom, voix: bestN, id: best.id } : null;
}

// ════════════════════════════════════════════════════════════
//  RÉVÉLATION — animation du chaudron
// ════════════════════════════════════════════════════════════
function lancerRevelation() {
  const roiList = listeOrdonnee(state.candidatsRoi);
  const reineList = listeOrdonnee(state.candidatsReine);
  if (roiList.length === 0 || reineList.length === 0) {
    state.message = { type: 'erreur', texte: "Il faut au moins un candidat roi et une candidate reine." };
    render(); return;
  }
  const comptes = compter();
  const gRoi = gagnant(comptes.roi, state.candidatsRoi);
  const gReine = gagnant(comptes.reine, state.candidatsReine);

  state.revealEnCours = true;
  render();

  // musique de suspense (si configurée)
  const audio = document.getElementById('audio-reveal');
  if (audio && MUSIQUE_REVELATION_URL) {
    try { audio.currentTime = 0; audio.play().catch(() => {}); } catch (e) {}
  }

  setTimeout(() => animerChaudron(roiList, reineList, gRoi, gReine), 80);
}

function animerChaudron(roiList, reineList, gRoi, gReine) {
  const scene = document.getElementById('chaudron-scene');
  const glow = document.getElementById('chaudron-glow');
  if (!scene) return;

  const t0 = performance.now();
  const pool = roiList.map(c => ({ nom: c.nom, cls: 'roi' }))
              .concat(reineList.map(c => ({ nom: c.nom, cls: 'reine' })));
  const finPluie = CLIMAX_MS - 2500; // les noms ont fini de tomber un peu avant le climax
  let climaxFait = false;

  // ── bouillon : les noms jaillissent de la surface et MONTENT en sortant du chaudron ──
  const churn = [];
  const MAX_CHURN = 8;
  function ajouterChurn(item) {
    const sc = document.getElementById('chaudron-scene'); if (!sc) return;
    const el = document.createElement('div');
    el.className = 'nom-churn ' + item.cls;
    el.textContent = item.nom;
    sc.appendChild(el);
    churn.push({
      el, born: performance.now(),
      life: 2600 + Math.random() * 1300,
      x0: (Math.random() - 0.5) * 0.10,        // décalage horizontal initial (fraction largeur image)
      swayPhase: Math.random() * Math.PI * 2,
      swaySpeed: 0.003 + Math.random() * 0.0025,
      swayAmp: 0.05 + Math.random() * 0.06,    // amplitude du balancement
      rise: 0.30 + Math.random() * 0.14        // hauteur de montée (fraction hauteur image)
    });
    if (churn.length > MAX_CHURN) {
      const vieux = churn.shift();
      const a = vieux.el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: 'forwards' });
      a.onfinish = () => vieux.el.remove();
    }
  }
  function majChurn(now, p) {
    const sc = document.getElementById('chaudron-scene');
    const img = document.getElementById('chaudron-img');
    if (!sc || !img) return;
    const sr = sc.getBoundingClientRect(), ir = img.getBoundingClientRect();
    const cx = (ir.left - sr.left) + ir.width * 0.5;
    const surfaceY = (ir.top - sr.top) + ir.height * 0.17;   // surface du bouillon
    for (let i = churn.length - 1; i >= 0; i--) {
      const c = churn[i];
      const age = now - c.born;
      const lp = age / c.life;                               // 0..1
      if (lp >= 1) { c.el.remove(); churn.splice(i, 1); continue; }
      const riseDist = ir.height * c.rise * (1 + p * 0.3);    // monte plus haut avec la tension
      const sway = Math.sin(c.swayPhase + age * c.swaySpeed) * ir.width * c.swayAmp * lp;
      const x = cx + ir.width * c.x0 + sway;
      const y = surfaceY - lp * riseDist;                     // remonte et sort par le haut
      const scale = 0.5 + Math.min(1, lp / 0.25) * 0.55 + lp * 0.15;
      const op = Math.min(1, lp / 0.12) * (1 - Math.max(0, (lp - 0.6) / 0.4));
      c.el.style.transform = `translate(-50%,-50%) translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${scale.toFixed(3)})`;
      c.el.style.opacity = op.toFixed(3);
    }
  }
  function dissoudreChurn() {
    for (const c of churn) {
      const a = c.el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 450, fill: 'forwards' });
      a.onfinish = () => c.el.remove();
    }
    churn.length = 0;
  }

  // pluie de noms : chaque candidat tombe UNE SEULE FOIS, cadence qui s'accélère (tension)
  const ordre = pool.slice();
  for (let i = ordre.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [ordre[i], ordre[j]] = [ordre[j], ordre[i]];
  }
  const n = ordre.length;
  ordre.forEach((item, i) => {
    const frac = n > 1 ? i / (n - 1) : 0;
    const t = NOMS_DEBUT_MS + Math.pow(frac, 1.7) * (finPluie - NOMS_DEBUT_MS);
    setTimeout(() => {
      if (document.getElementById('chaudron-scene')) fairePleuvoirNom(scene, item, ajouterChurn);
    }, t);
  });

  // boucle d'intensité : lueur, secousse, bulles montent avec le temps
  let dernierBulle = 0;
  function boucle(now) {
    if (!document.getElementById('chaudron-scene')) return;
    const elapsed = now - t0;
    const p = Math.min(1, elapsed / CLIMAX_MS);

    // lueur du chaudron
    if (glow) {
      const a = 0.15 + p * 0.75;
      glow.style.background = `radial-gradient(ellipse at center, rgba(255,150,40,${a}), rgba(212,175,55,${a*0.6}) 55%, transparent 72%)`;
      glow.style.transform = `translate(-50%,0) scale(${0.8 + p * 0.5})`;
      glow.style.filter = `blur(${8 + p * 10}px)`;
    }
    // bulles dorées qui jaillissent du chaudron
    if (now - dernierBulle > (240 - p * 200)) {
      dernierBulle = now;
      fAireBulle(scene, p);
    }
    // noms qui bouillonnent dans la marmite
    majChurn(now, p);
    // secousse croissante sur la fin
    if (p > 0.45) {
      scene.classList.add('secoue');
      scene.style.setProperty('--shake', (1 + (p - 0.45) * 12).toFixed(1) + 'px');
    }

    if (elapsed >= CLIMAX_MS) {
      if (!climaxFait) { climaxFait = true; dissoudreChurn(); climax(gRoi, gReine); }
      return;
    }
    requestAnimationFrame(boucle);
  }
  requestAnimationFrame(boucle);
}

function fairePleuvoirNom(scene, item, onLand) {
  const el = document.createElement('div');
  el.className = 'nom-tombe ' + item.cls;
  el.textContent = item.nom;
  scene.appendChild(el);
  const img = document.getElementById('chaudron-img');
  let cibleY = scene.clientHeight * 0.20; // défaut : ouverture approximative
  if (img) {
    const sr = scene.getBoundingClientRect(), ir = img.getBoundingClientRect();
    cibleY = (ir.top - sr.top) + ir.height * 0.185;
  }
  const largeur = scene.clientWidth;
  const x0 = (Math.random() - 0.5) * largeur * 0.42;
  const r0 = (Math.random() - 0.5) * 22;
  const dur = 650 + Math.random() * 300;
  const anim = el.animate([
    { transform: `translate(-50%,0) translate(${x0}px,-14px) rotate(${r0}deg) scale(1)`, opacity: 0 },
    { transform: `translate(-50%,0) translate(${x0*0.5}px, ${cibleY*0.55}px) rotate(${r0*0.5}deg) scale(0.9)`, opacity: 1, offset: 0.55 },
    { transform: `translate(-50%,0) translate(0px, ${cibleY}px) rotate(0deg) scale(0.5)`, opacity: 0.12 }
  ], { duration: dur, easing: 'cubic-bezier(0.5,0,0.7,1)', fill: 'forwards' });
  anim.onfinish = () => { el.remove(); if (onLand) onLand(item); };
}

function fAireBulle(scene, p) {
  const b = document.createElement('div');
  b.className = 'bulle';
  const taille = 5 + Math.random() * (7 + p * 14);
  const img = document.getElementById('chaudron-img');
  let surfaceY = scene.clientHeight * 0.18, cx = scene.clientWidth * 0.5, demi = scene.clientWidth * 0.16;
  if (img) {
    const sr = scene.getBoundingClientRect(), ir = img.getBoundingClientRect();
    surfaceY = (ir.top - sr.top) + ir.height * 0.17;   // surface du bouillon
    cx = (ir.left - sr.left) + ir.width * 0.5;
    demi = ir.width * 0.17;
  }
  const x = cx + (Math.random() - 0.5) * demi * 2;
  b.style.cssText += `left:${x}px;top:${surfaceY}px;width:${taille}px;height:${taille}px;`;
  scene.appendChild(b);
  const monte = 70 + Math.random() * (110 + p * 180);   // monte bien plus haut, en sortant du chaudron
  const anim = b.animate([
    { transform: 'translate(-50%,0) translateY(8px) scale(0.4)', opacity: 0 },
    { transform: 'translate(-50%,0) translateY(0) scale(1)', opacity: 0.95, offset: 0.18 },
    { transform: `translate(-50%,0) translateY(-${monte}px) scale(1.15)`, opacity: 0 }
  ], { duration: 800 + Math.random() * 700, easing: 'ease-out' });
  anim.onfinish = () => b.remove();
}

function climax(gRoi, gReine) {
  const scene = document.getElementById('chaudron-scene');
  if (scene) { scene.classList.remove('secoue'); scene.style.removeProperty('--shake'); }

  // flash lumineux
  const flash = document.getElementById('reveal-flash');
  if (flash) {
    flash.animate([{ opacity: 0 }, { opacity: 1, offset: 0.15 }, { opacity: 0 }],
      { duration: 900, easing: 'ease-out' });
  }
  // le chaudron sursaute puis s'estompe pour laisser place aux parchemins
  const img = document.getElementById('chaudron-img');
  if (img) {
    img.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.12)' }, { transform: 'scale(1)' }],
      { duration: 600, easing: 'ease-out' });
  }
  if (scene) scene.animate([{ opacity: 1 }, { opacity: 0.18 }],
    { duration: 800, delay: 300, fill: 'forwards', easing: 'ease' });

  // titre s'efface
  const titre = document.getElementById('reveal-titre');
  if (titre) titre.style.opacity = '0';

  lancerConfettis();

  // les deux parchemins s'inscrivent EN MÊME TEMPS
  setTimeout(() => {
    remplirParchemin('roi', gRoi);
    remplirParchemin('reine', gReine);
  }, 350);
}

function remplirParchemin(cat, g) {
  const p = document.getElementById('parchemin-' + cat);
  if (!p) return;
  const nomEl = document.getElementById('pnom-' + cat);
  const voixEl = document.getElementById('pvoix-' + cat);
  if (nomEl) nomEl.textContent = g ? g.nom : '—';
  if (voixEl) voixEl.textContent = g ? (g.voix + ' voix') : '';
  p.classList.add('show');
}

function lancerConfettis() {
  const couleurs = ['#d4af37', '#e8c96a', '#b3251f', '#f4ead5'];
  for (let i = 0; i < 80; i++) {
    const c = document.createElement('div');
    c.style.cssText = `position:fixed;top:-20px;left:${Math.random()*100}vw;width:9px;height:9px;
      background:${couleurs[i%couleurs.length]};z-index:9999;border-radius:1px;pointer-events:none;
      transform:rotate(${Math.random()*360}deg);`;
    document.body.appendChild(c);
    const chute = 2200 + Math.random() * 2000;
    c.animate([
      { transform: `translateY(0) rotate(0deg)`, opacity: 1 },
      { transform: `translateY(105vh) rotate(${720*(Math.random()>.5?1:-1)}deg)`, opacity: 0.9 }
    ], { duration: chute, easing: 'cubic-bezier(0.3,0.7,0.5,1)' });
    setTimeout(() => c.remove(), chute);
  }
}

function render() {
  const app = document.getElementById('app');
  // Pendant l'animation du chaudron, on ne re-render pas : un vote tardif
  // ou un rafraîchissement Firebase casserait l'animation en cours.
  if (state.vue === 'reveal' && state.revealEnCours && app.querySelector('#chaudron-scene')) return;
  if (!firebaseReady) {
    app.innerHTML = `<div class="ecran"><div class="dragon">🐉</div>
      <div class="titre-grand">Configuration</div>
      <p class="sous-titre">La base de données n'est pas joignable.</p></div>`;
    return;
  }
  let html = '';
  switch (state.vue) {
    case 'accueil':     html = vueAccueil(); break;
    case 'vote-code':   html = vueVoteCode(); break;
    case 'vote-choix':  html = vueVoteChoix(); break;
    case 'vote-merci':  html = vueMerci(); break;
    case 'admin-login': html = vueAdminLogin(); break;
    case 'admin':       html = vueAdmin(); break;
    case 'reveal':      html = vueReveal(); break;
    default:            html = vueAccueil();
  }
  app.innerHTML = html;
  attachEvents();
}

function vueVoteCode() {
  const code = state.codeSaisi;
  const slots = [];
  for (let i = 0; i < 5; i++) {
    if (i === 3) slots.push(`<div class="slot sep">·</div>`);
    const actif = i === code.length ? 'actif' : '';
    slots.push(`<div class="slot ${actif}">${escapeHtml(code[i] || '')}</div>`);
  }
  const phase = code.length < 3 ? 'chiffres' : 'lettres';
  const hint = code.length < 3 ? "Saisis les 3 chiffres de ton code"
             : code.length < 5 ? "Maintenant les 2 lettres"
             : "C'est parti…";
  let pave = '';
  if (phase === 'chiffres') {
    let touches = '';
    for (let d = 1; d <= 9; d++) touches += `<button class="touche" data-key="${d}">${d}</button>`;
    touches += `<button class="touche efface" data-action="efface">⌫</button>`;
    touches += `<button class="touche" data-key="0">0</button>`;
    touches += `<button class="touche efface" data-action="efface">⌫</button>`;
    pave = `<div class="pave chiffres">${touches}</div>`;
  } else {
    let touches = LETTRES.map(l => `<button class="touche" data-key="${l}">${l}</button>`).join('');
    touches += `<button class="touche efface" data-action="efface">⌫</button>`;
    pave = `<div class="pave lettres">${touches}</div>`;
  }
  return `
    <div class="ecran">
      <div class="lien-admin" data-action="go-admin" title="Espace organisateurs">${ICONE_ROUAGE}</div>
      <div class="ornement" style="font-size:32px">♛</div>
      <h1 class="titre-grand" style="font-size:clamp(24px,5vw,42px)">Ton code royal</h1>
      <div class="code-slots">${slots.join('')}</div>
      <div class="hint-code">${hint}</div>
      ${state.message ? `<div class="message ${state.message.type}">${escapeHtml(state.message.texte)}</div>` : ''}
      ${pave}
    </div>`;
}

function carteCand(cat, c, choisi) {
  return `<div class="carte-cand ${choisi ? 'choisi' : ''}" data-action="choisir" data-cat="${cat}" data-id="${escapeHtml(c.id)}">${escapeHtml(c.nom)}</div>`;
}
function vueVoteChoix() {
  const roi = listeOrdonnee(state.candidatsRoi);
  const reine = listeOrdonnee(state.candidatsReine);
  const pret = state.choixRoi && state.choixReine;
  return `
    <div class="ecran" style="justify-content:flex-start;padding-top:5vh">
      <div class="ornement" style="font-size:30px">♛ ♛</div>
      <h1 class="titre-grand" style="font-size:clamp(22px,4.5vw,36px)">À toi de couronner</h1>
      <div class="vote-wrap">
        <div class="cat-titre"><span class="pico">♚</span> Le Roi</div>
        ${roi.length ? `<div class="grille-cand">${roi.map(c => carteCand('roi', c, state.choixRoi === c.id)).join('')}</div>`
                     : `<div class="liste-vide">Aucun candidat enregistré.</div>`}
        <div class="cat-titre"><span class="pico">♛</span> La Reine</div>
        ${reine.length ? `<div class="grille-cand">${reine.map(c => carteCand('reine', c, state.choixReine === c.id)).join('')}</div>`
                       : `<div class="liste-vide">Aucune candidate enregistrée.</div>`}
        ${state.message ? `<div class="message ${state.message.type}">${escapeHtml(state.message.texte)}</div>` : ''}
        <div style="text-align:center">
          <button class="cta" data-action="valider-vote" ${pret && !state.enValidation ? '' : 'disabled'}>
            ${state.enValidation ? 'Envoi…' : 'Valider mon vote'}
          </button>
        </div>
        <div style="text-align:center;margin-top:14px">
          <span class="retour-mini" style="position:static" data-action="annuler-vote">↩ Recommencer</span>
        </div>
      </div>
    </div>`;
}

  return `
    <div class="ecran">
      <div class="merci-couronne">♛</div>
      <div class="ornement">✦ ✦ ✦</div>
      <h1 class="titre-grand">Vote enregistré !</h1>
      <p class="sous-titre">Merci, ton choix royal est dans l'urne.</p>
      <button class="cta-second" data-action="vote-suivant" style="margin-top:24px">Au suivant →</button>
    </div>`;
}

function vueAdminLogin() {
  return `
    <div class="ecran">
      <div class="retour-mini" data-action="go-accueil">← Retour</div>
      <div class="ornement" style="font-size:30px">🐉</div>
      <h1 class="titre-grand" style="font-size:clamp(24px,5vw,40px)">Espace organisateurs</h1>
      <div style="width:min(360px,90vw);margin-top:24px">
        <input class="input-txt" type="password" id="input-password" placeholder="Mot de passe" style="width:100%;text-align:center" />
        ${state.message ? `<div class="message ${state.message.type}">${escapeHtml(state.message.texte)}</div>` : ''}
        <button class="cta" data-action="connect-admin" style="width:100%;margin-top:14px">Entrer</button>
      </div>
    </div>`;
}

function vueAdmin() {
  const onglet = state.ongletActif;
  const tab = (id, label) => `<button class="onglet ${onglet === id ? 'actif' : ''}" data-onglet="${id}">${label}</button>`;
  let contenu = '';
  if (onglet === 'candidats') contenu = panneauCandidats();
  else if (onglet === 'codes') contenu = panneauCodes();
  else if (onglet === 'reveal') contenu = panneauReveal();
  else if (onglet === 'reglages') contenu = panneauReglages();
  return `
    <div class="admin-wrap">
      <div class="retour-mini" data-action="go-accueil">← Accueil</div>
      <div class="admin-head">
        <div class="ornement" style="font-size:26px">🐉</div>
        <h1>Espace organisateurs</h1>
      </div>
      <div class="onglets">
        ${tab('candidats', 'Candidats')}
        ${tab('codes', 'Codes')}
        ${tab('reveal', 'Révélation')}
        ${tab('reglages', 'Réglages')}
      </div>
      ${contenu}
    </div>`;
}

function colonneCands(cat, titre, candidats) {
  const liste = listeOrdonnee(candidats);
  return `
    <div>
      <h2>${titre} <span style="color:var(--gris);font-size:15px">(${liste.length})</span></h2>
      <div class="ligne-ajout">
        <input class="input-txt" id="input-${cat}" placeholder="Nom du candidat" />
        <button class="btn-or" data-action="ajouter-cand" data-cat="${cat}">Ajouter</button>
      </div>
      <div class="liste-noms">
        ${liste.length ? liste.map(c => `
          <div class="nom-item"><span>♛ ${escapeHtml(c.nom)}</span>
            <span class="x" data-action="suppr-cand" data-cat="${cat}" data-id="${escapeHtml(c.id)}">×</span></div>
        `).join('') : `<div class="liste-vide">Aucun nom pour l'instant.</div>`}
      </div>
    </div>`;
}
function panneauCandidats() {
  return `<div class="panneau">
    <div class="deux-col">
      ${colonneCands('roi', '♚ Candidats Roi', state.candidatsRoi)}
      ${colonneCands('reine', '♛ Candidates Reine', state.candidatsReine)}
    </div>
    <p class="note">Astuce : appuie sur Entrée dans le champ pour ajouter rapidement plusieurs noms à la suite.</p>
  </div>`;
}

function panneauCodes() {
  const codes = Object.keys(state.codes).sort();
  const nbVotes = Object.keys(state.votes).length;
  return `<div class="panneau">
    <h2>Codes de vote</h2>
    <div class="stat-grille">
      <div class="stat-box"><div class="num">${codes.length}</div><div class="lbl">Codes générés</div></div>
      <div class="stat-box"><div class="num">${nbVotes}</div><div class="lbl">Codes ayant voté</div></div>
      <div class="stat-box"><div class="num">${Math.max(0, codes.length - nbVotes)}</div><div class="lbl">Restants</div></div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <button class="btn-or" data-action="generer" data-nb="200">Générer 200 codes</button>
      <button class="btn-or" data-action="generer" data-nb="50">+ 50 codes</button>
      <button class="btn-or" data-action="imprimer">🖨 Imprimer / découper</button>
    </div>
    <p class="note">Génère les codes une fois, imprime la planche (4 par colonne), découpe et distribue à l'entrée. Chaque code ne peut voter qu'une seule fois.</p>
    ${codes.length ? `<div class="codes-grille">${codes.map(c => `<div class="code-chip">${c.slice(0,3)} ${c.slice(3)}</div>`).join('')}</div>` : ''}
  </div>
  ${codes.length ? planchesImpression(codes) : ''}`;
}
function planchesImpression(codes) {
  return `<div class="print-zone">
    <div class="print-grid">
      ${codes.map(c => `
        <div class="print-slip">
          <div class="pt-orn">✦ ✦ ✦</div>
          <div class="pt-evt">Bal — Roi &amp; Reine · Collège Camille Sée</div>
          <div class="pt-code">${c.slice(0,3)} ${c.slice(3)}</div>
          <div class="pt-note">1 vote — à conserver</div>
        </div>`).join('')}
    </div>
  </div>`;
}

function panneauReveal() {
  const nbVotes = Object.keys(state.votes).length;
  const roiN = listeOrdonnee(state.candidatsRoi).length;
  const reineN = listeOrdonnee(state.candidatsReine).length;
  return `<div class="panneau">
    <h2>Lancer la révélation</h2>
    <div class="stat-grille">
      <div class="stat-box"><div class="num">${nbVotes}</div><div class="lbl">Votes reçus</div></div>
      <div class="stat-box"><div class="num">${roiN}</div><div class="lbl">Candidats roi</div></div>
      <div class="stat-box"><div class="num">${reineN}</div><div class="lbl">Candidates reine</div></div>
    </div>
    <p class="note">À utiliser sur l'ordinateur de la scène. Au clic sur « Révéler », la musique démarre, le chaudron bouillonne et les noms y tombent ; au climax (réglé sur ${Math.round(CLIMAX_MS/1000)} s) le roi et la reine s'inscrivent ensemble dans les parchemins, avec leur nombre de voix.</p>
    <div style="text-align:center;margin-top:18px">
      <button class="btn-or" data-action="ouvrir-reveal" style="font-size:16px;padding:16px 34px" ${roiN && reineN ? '' : 'disabled'}>Ouvrir l'écran de révélation</button>
    </div>
    ${(!roiN || !reineN) ? `<p class="note" style="color:var(--rouge);text-align:center">Ajoute au moins un candidat dans chaque catégorie.</p>` : ''}
  </div>`;
}

function panneauReglages() {
  return `<div class="panneau">
    <h2>Réglages</h2>
    <p class="note" style="margin-top:0">Actions sensibles — à manier avec précaution.</p>
    <div style="display:flex;flex-direction:column;gap:14px;margin-top:16px;max-width:420px">
      <button class="btn-danger" data-action="reinit-votes">Effacer tous les votes (garder les codes)</button>
      <button class="btn-danger" data-action="effacer-codes">Supprimer tous les codes</button>
      <button class="cta-second" data-action="deconnexion" style="margin-top:6px">Se déconnecter</button>
    </div>
  </div>`;
}

function parcheminHtml(cat, role) {
  return `
    <div class="parchemin" id="parchemin-${cat}" style="background-image:url('https://raw.githubusercontent.com/fsomsois-source/ElectionBal/main/Parchemin.png')">
      <div class="parchemin-contenu">
        <div class="parchemin-role">${role}</div>
        <div class="parchemin-nom" id="pnom-${cat}">—</div>
        <div class="parchemin-voix" id="pvoix-${cat}"></div>
      </div>
    </div>`;
}
function vueReveal() {
  return `
    <div class="reveal-ecran">
      <div class="retour-mini" data-action="go-admin">← Admin</div>
      ${MUSIQUE_REVELATION_URL ? `<audio id="audio-reveal" src="${escapeHtml(MUSIQUE_REVELATION_URL)}" preload="auto"></audio>` : ''}
      <div id="reveal-flash" class="flash"></div>
      <h1 class="reveal-titre" id="reveal-titre">Le couple royal</h1>

      <div class="chaudron-scene" id="chaudron-scene">
        <div class="chaudron-glow" id="chaudron-glow"></div>
        <img class="chaudron-img" id="chaudron-img" src="https://raw.githubusercontent.com/fsomsois-source/ElectionBal/main/Chaudron.png" alt="" />
      </div>

      <div class="parchemins">
        ${parcheminHtml('roi', '♚ Roi')}
        ${parcheminHtml('reine', '♛ Reine')}
      </div>

      ${state.message ? `<div class="message ${state.message.type}">${escapeHtml(state.message.texte)}</div>` : ''}
      <div style="margin-top:8px">
        ${!state.revealEnCours ? `<button class="cta" data-action="lancer-reveal">✦ Révéler ✦</button>`
          : `<button class="cta-second" data-action="relancer-reveal">Recommencer</button>`}
      </div>
    </div>`;
}

// ════════════════════════════════════════════════════════════
//  ÉVÉNEMENTS
// ════════════════════════════════════════════════════════════
function attachEvents() {
  document.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', async (e) => {
      const a = el.getAttribute('data-action');
      if (a === 'go-vote') retourAccueilVote();
      else if (a === 'go-admin') {
        state.vue = sessionStorage.getItem('balReineAuth') === 'ok' ? 'admin' : 'admin-login';
        location.hash = '#/admin'; render();
      }
      else if (a === 'go-accueil') navigate('accueil');
      else if (a === 'efface') effacerCode();
      else if (a === 'choisir') {
        const cat = el.getAttribute('data-cat'), id = el.getAttribute('data-id');
        if (cat === 'roi') state.choixRoi = id; else state.choixReine = id;
        state.message = null; render();
      }
      else if (a === 'valider-vote') envoyerVote();
      else if (a === 'annuler-vote') retourAccueilVote();
      else if (a === 'vote-suivant') retourAccueilVote();
      else if (a === 'connect-admin') {
        const pwd = (document.getElementById('input-password') || {}).value || '';
        if (pwd === ADMIN_PASSWORD) { sessionStorage.setItem('balReineAuth', 'ok'); state.vue = 'admin'; state.message = null; render(); }
        else { state.message = { type: 'erreur', texte: "Mot de passe incorrect." }; render(); }
      }
      else if (a === 'deconnexion') { sessionStorage.removeItem('balReineAuth'); navigate('accueil'); }
      else if (a === 'ajouter-cand') ajouterCandidat(el.getAttribute('data-cat'));
      else if (a === 'suppr-cand') supprimerCandidat(el.getAttribute('data-cat'), el.getAttribute('data-id'));
      else if (a === 'generer') genererCodes(parseInt(el.getAttribute('data-nb'), 10));
      else if (a === 'imprimer') imprimerCodes();
      else if (a === 'reinit-votes') reinitVotes();
      else if (a === 'effacer-codes') effacerCodes();
      else if (a === 'ouvrir-reveal') { state.revealEnCours = false; navigate('reveal'); }
      else if (a === 'lancer-reveal') lancerRevelation();
      else if (a === 'relancer-reveal') { state.revealEnCours = false; render(); }
    });
  });

  // onglets de l'admin
  document.querySelectorAll('[data-onglet]').forEach(el => {
    el.addEventListener('click', () => { state.ongletActif = el.getAttribute('data-onglet'); render(); });
  });

  // pavé tactile (chiffres / lettres)
  document.querySelectorAll('[data-key]').forEach(el => {
    el.addEventListener('click', () => taperCode(el.getAttribute('data-key')));
  });

  // entrée clavier pour ajout candidat & mot de passe
  ['roi', 'reine'].forEach(cat => {
    const inp = document.getElementById('input-' + cat);
    if (inp) inp.addEventListener('keydown', e => { if (e.key === 'Enter') ajouterCandidat(cat); });
  });
  const pwd = document.getElementById('input-password');
  if (pwd) { pwd.addEventListener('keydown', e => { if (e.key === 'Enter') document.querySelector('[data-action="connect-admin"]').click(); }); pwd.focus(); }
}

// ════════════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════════════
const hash = location.hash;
if (hash === '#/admin') state.vue = sessionStorage.getItem('balReineAuth') === 'ok' ? 'admin' : 'admin-login';
else if (hash === '#/vote') state.vue = 'vote-code';
else if (hash === '#/reveal') state.vue = 'reveal';

if (firebaseReady) startListeners();
render();
</script>
